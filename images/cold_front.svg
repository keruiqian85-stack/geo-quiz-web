<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f8fafc" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">冷锋天气系统结构与降水区域示意图</text>

  <!-- 地面 -->
  <line x1="0" y1="260" x2="600" y2="260" stroke="#334155" stroke-width="3"/>
  <rect x="0" y="260" width="600" height="60" fill="#e2e8f0"/>

  <!-- 锋面倾斜线 -->
  <path d="M 420 260 L 150 90" fill="none" stroke="#2563eb" stroke-width="3.5"/>

  <!-- 冷气团 (楔形主动插入) -->
  <path d="M 0 260 L 420 260 L 150 90 L 0 90 Z" fill="#dbeafe" opacity="0.7"/>
  <text x="140" y="200" font-size="16" font-weight="bold" fill="#1e40af">冷气团 (主动前进)</text>
  <!-- 冷气团推进大箭头 -->
  <path d="M 80 230 L 260 230" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polygon points="260,230 248,223 248,237" fill="#2563eb"/>

  <!-- 暖气团 (被迫抬升) -->
  <text x="440" y="160" font-size="16" font-weight="bold" fill="#b91c1c">暖气团 (被迫抬升)</text>
  <path d="M 430 220 Q 320 180 260 110" fill="none" stroke="#ef4444" stroke-width="3"/>
  <polygon points="260,110 270,116 262,126" fill="#ef4444"/>

  <!-- 锋后雨区云与降水 -->
  <g fill="#94a3b8">
    <ellipse cx="260" cy="110" rx="45" ry="22"/>
    <ellipse cx="300" cy="105" rx="35" ry="20"/>
  </g>
  <!-- 雨丝 -->
  <g stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4">
    <line x1="240" y1="135" x2="230" y2="255"/>
    <line x1="270" y1="135" x2="260" y2="255"/>
    <line x1="300" y1="135" x2="290" y2="255"/>
    <line x1="330" y1="135" x2="320" y2="255"/>
  </g>
  <rect x="230" y="270" width="130" height="24" rx="4" fill="#0284c7"/>
  <text x="295" y="287" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🌧️ 降水主要在【锋后】</text>

  <text x="500" y="287" font-size="12" fill="#64748b">锋前（过境前晴朗）</text>
  <text x="80" y="287" font-size="12" fill="#64748b">锋后（过境后气温降、气压升）</text>
</svg>