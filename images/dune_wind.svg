<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#fffbeb" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">新月形沙丘形态与主导风向判读示意图</text>

  <!-- 俯视图与剖面图左右对比 -->
  <!-- 左：俯视图 -->
  <g transform="translate(60, 60)">
    <text x="100" y="20" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">【平面俯视图】</text>
    <!-- 新月形月牙 -->
    <path d="M 40 100 Q 120 40 160 100 Q 110 70 40 100 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M 40 100 Q 120 160 160 100 Q 110 130 40 100 Z" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
    <!-- 两个翼角顺风延伸 -->
    <text x="165" y="105" font-size="11" fill="#b45309">顺风翼角延伸 ➔</text>
    <text x="30" y="105" font-size="11" fill="#b45309">迎风坡微凸</text>

    <!-- 风向箭头 -->
    <path d="M 10 100 L 70 100" fill="none" stroke="#2563eb" stroke-width="4"/>
    <polygon points="70,100 58,94 58,106" fill="#2563eb"/>
    <text x="40" y="90" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">主导风向</text>
  </g>

  <!-- 右：侧面剖面图 -->
  <g transform="translate(340, 60)">
    <text x="100" y="20" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">【侧面垂直剖面图】</text>

    <!-- 迎风坡缓，背风坡陡 -->
    <path d="M 10 160 L 110 90 L 160 160 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#78350f" stroke-width="2"/>

    <text x="45" y="120" font-size="12" font-weight="bold" fill="#15803d">迎风坡 (缓坡)</text>
    <text x="140" y="130" font-size="12" font-weight="bold" fill="#dc2626">背风坡 (陡坡)</text>

    <!-- 风向箭头 -->
    <path d="M -10 120 L 40 100" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polygon points="40,100 28,100 34,110" fill="#2563eb"/>
  </g>

  <rect x="40" y="255" width="520" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="300" y="275" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">🔑 核心判读口诀：迎风坡缓、背风坡陡；凸面迎风、翼角顺风。</text>
  <text x="300" y="293" font-size="12" fill="#78350f" text-anchor="middle">成因：风力堆积地貌（常见于我国西北干旱半干旱地区）</text>
</svg>