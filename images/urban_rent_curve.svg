<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f8fafc" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">各类土地利用付租能力随距离递减示意图</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="240" x2="540" y2="240" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="240" x2="80" y2="40" stroke="#334155" stroke-width="2"/>
  <polygon points="540,240 530,235 530,245" fill="#334155"/>
  <polygon points="80,40 75,50 85,50" fill="#334155"/>
  <text x="545" y="245" font-size="12" fill="#334155">距市中心距离</text>
  <text x="75" y="32" font-size="12" fill="#334155" text-anchor="end">地租水平</text>

  <!-- 商业曲线 (陡峭) -->
  <line x1="80" y1="50" x2="280" y2="240" stroke="#dc2626" stroke-width="3"/>
  <text x="140" y="70" font-size="12" font-weight="bold" fill="#dc2626">商业付租曲线</text>

  <!-- 住宅曲线 (中等) -->
  <line x1="80" y1="100" x2="430" y2="240" stroke="#2563eb" stroke-width="3"/>
  <text x="260" y="125" font-size="12" font-weight="bold" fill="#2563eb">住宅付租曲线</text>

  <!-- 工业曲线 (平缓) -->
  <line x1="80" y1="150" x2="520" y2="240" stroke="#16a34a" stroke-width="3"/>
  <text x="420" y="170" font-size="12" font-weight="bold" fill="#16a34a">工业付租曲线</text>

  <!-- 交点分界虚线 -->
  <line x1="185" y1="150" x2="185" y2="240" stroke="#94a3b8" stroke-dasharray="4,4"/>
  <line x1="330" y1="180" x2="330" y2="240" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- 区域色块标注 -->
  <rect x="80" y="250" width="105" height="30" fill="#fee2e2" rx="4"/>
  <text x="132" y="270" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">商业区 (A)</text>

  <rect x="185" y="250" width="145" height="30" fill="#dbeafe" rx="4"/>
  <text x="257" y="270" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">住宅区 (B)</text>

  <rect x="330" y="250" width="190" height="30" fill="#dcfce7" rx="4"/>
  <text x="425" y="270" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">工业区 (C)</text>

  <text x="80" y="255" font-size="11" fill="#64748b" text-anchor="middle">市中心(O)</text>
</svg>