<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f8fafc" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">断层构造类型（地垒与地堑）示意图</text>

  <!-- 地垒 (中间相对上升) -->
  <g transform="translate(30, 60)">
    <text x="120" y="20" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">【地 垒】（相对上升岩块）</text>
    <polygon points="20,180 80,180 100,100 160,100 180,180 240,180 240,220 20,220" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
    <line x1="80" y1="180" x2="100" y2="100" stroke="#dc2626" stroke-width="3"/>
    <line x1="180" y1="180" x2="160" y2="100" stroke="#dc2626" stroke-width="3"/>
    <!-- 上升箭头 -->
    <path d="M 130 150 L 130 115" fill="none" stroke="#dc2626" stroke-width="3"/>
    <polygon points="130,115 125,125 135,125" fill="#dc2626"/>
    <text x="130" y="85" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">块状山 (如华山/泰山/庐山)</text>
  </g>

  <!-- 地堑 (中间相对下沉) -->
  <g transform="translate(320, 60)">
    <text x="120" y="20" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">【地 堑】（相对下沉岩块）</text>
    <polygon points="20,100 80,100 100,180 160,180 180,100 240,100 240,220 20,220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <line x1="80" y1="100" x2="100" y2="180" stroke="#2563eb" stroke-width="3"/>
    <line x1="180" y1="100" x2="160" y2="180" stroke="#2563eb" stroke-width="3"/>
    <!-- 下沉箭头 -->
    <path d="M 130 130 L 130 165" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polygon points="130,165 125,155 135,155" fill="#2563eb"/>
    <text x="130" y="205" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">谷地/盆地 (如渭河平原/汾河谷地)</text>
  </g>
</svg>