<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f8fafc" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">白天海陆间热力环流（海风）示意图</text>

  <!-- 太阳 -->
  <circle cx="300" cy="50" r="18" fill="#f59e0b"/>
  <text x="300" y="80" font-size="11" fill="#b45309" text-anchor="middle">白天（太阳辐射强烈）</text>

  <!-- 陆地与海洋底色 -->
  <rect x="30" y="210" width="260" height="90" fill="#fed7aa" rx="4"/>
  <text x="160" y="245" font-size="15" font-weight="bold" fill="#9a3412" text-anchor="middle">陆 地</text>
  <text x="160" y="268" font-size="12" fill="#c2410c" text-anchor="middle">比热容小 · 升温快 · 气温高</text>
  <text x="160" y="288" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">【近地面形成低气压】</text>

  <rect x="310" y="210" width="260" height="90" fill="#bae6fd" rx="4"/>
  <text x="440" y="245" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">海 洋</text>
  <text x="440" y="268" font-size="12" fill="#0284c7" text-anchor="middle">比热容大 · 升温慢 · 气温低</text>
  <text x="440" y="288" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">【近地面形成高气压】</text>

  <!-- 环流箭头 -->
  <!-- 1. 陆地热空气上升 -->
  <path d="M 160 200 L 160 110" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <polygon points="160,110 154,122 166,122" fill="#ef4444"/>
  <text x="135" y="155" font-size="12" fill="#ef4444" font-weight="bold">气流上升</text>

  <!-- 2. 高空从陆向海 -->
  <path d="M 175 105 L 420 105" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="5,4"/>
  <polygon points="420,105 408,99 408,111" fill="#64748b"/>
  <text x="300" y="100" font-size="11" fill="#64748b" text-anchor="middle">高空气流</text>

  <!-- 3. 海洋冷空气下沉 -->
  <path d="M 440 110 L 440 200" fill="none" stroke="#0284c7" stroke-width="3.5"/>
  <polygon points="440,200 434,188 446,188" fill="#0284c7"/>
  <text x="450" y="155" font-size="12" fill="#0284c7" font-weight="bold">气流下沉</text>

  <!-- 4. 近地面海风 -->
  <path d="M 410 195 L 195 195" fill="none" stroke="#059669" stroke-width="4"/>
  <polygon points="195,195 207,189 207,201" fill="#059669"/>
  <rect x="245" y="175" width="110" height="24" rx="4" fill="#10b981"/>
  <text x="300" y="192" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">💨 海 风 (从海吹向陆)</text>
</svg>