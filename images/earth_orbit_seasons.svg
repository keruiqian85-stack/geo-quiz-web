<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#090d16" rx="12"/>
  <text x="300" y="30" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">地球公转二分二至日轨道示意图</text>

  <!-- 太阳 -->
  <circle cx="300" cy="160" r="32" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
  <text x="300" y="165" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">太 阳</text>

  <!-- 轨道椭圆虚线 -->
  <ellipse cx="300" cy="160" rx="230" ry="100" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- 四个位置地球 -->
  <!-- 左：夏至日 (6月22日前后) -->
  <g transform="translate(70, 160)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8"/>
    <!-- 地轴倾斜 -->
    <line x1="-8" y1="-24" x2="8" y2="24" stroke="#e2e8f0" stroke-width="2"/>
    <!-- 昼半球 (向太阳侧亮) -->
    <path d="M 0 -18 A 18 18 0 0 1 0 18 Z" fill="#fde047" opacity="0.6"/>
    <text x="0" y="-30" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">【夏至日】</text>
    <text x="0" y="38" font-size="11" fill="#94a3b8" text-anchor="middle">直射北回归线</text>
  </g>

  <!-- 右：冬至日 (12月22日前后) -->
  <g transform="translate(530, 160)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8"/>
    <line x1="-8" y1="-24" x2="8" y2="24" stroke="#e2e8f0" stroke-width="2"/>
    <!-- 昼半球 (向太阳侧亮) -->
    <path d="M 0 -18 A 18 18 0 0 0 0 18 Z" fill="#fde047" opacity="0.6"/>
    <text x="0" y="-30" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">【冬至日】</text>
    <text x="0" y="38" font-size="11" fill="#94a3b8" text-anchor="middle">直射南回归线</text>
  </g>

  <!-- 上：春分日 (3月21日前后) -->
  <g transform="translate(300, 60)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8"/>
    <line x1="-8" y1="-24" x2="8" y2="24" stroke="#e2e8f0" stroke-width="2"/>
    <text x="0" y="-28" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">【春分日】(3月21日)</text>
    <text x="50" y="5" font-size="11" fill="#94a3b8">直射赤道</text>
  </g>

  <!-- 下：秋分日 (9月23日前后) -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8"/>
    <line x1="-8" y1="-24" x2="8" y2="24" stroke="#e2e8f0" stroke-width="2"/>
    <text x="0" y="32" font-size="13" font-weight="bold" fill="#fb923c" text-anchor="middle">【秋分日】(9月23日)</text>
    <text x="50" y="5" font-size="11" fill="#94a3b8">直射赤道</text>
  </g>

  <!-- 逆时针公转方向箭头 -->
  <path d="M 180 80 A 230 100 0 0 1 230 65" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="180,80 188,72 192,84" fill="#f59e0b"/>
</svg>