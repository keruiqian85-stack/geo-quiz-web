<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f0f9ff" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">大气受热过程与保温作用示意图</text>

  <!-- 太阳 -->
  <circle cx="80" cy="70" r="30" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="75" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">太阳</text>

  <!-- 地面 -->
  <rect x="0" y="240" width="600" height="80" fill="#84cc16"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#4d7c0f" stroke-width="3"/>
  <text x="300" y="275" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">地 面（吸收太阳辐射而增温）</text>

  <!-- 大气层色带 -->
  <rect x="0" y="100" width="600" height="140" fill="#38bdf8" opacity="0.15"/>
  <text x="530" y="130" font-size="13" fill="#0284c7" font-weight="bold">大 气 层</text>

  <!-- 1. 太阳短波辐射箭头 -->
  <path d="M 110 85 L 180 230" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <polygon points="180,230 173,218 187,222" fill="#ea580c"/>
  <text x="110" y="150" font-size="12" fill="#ea580c" font-weight="bold">① 太阳短波辐射</text>
  <text x="110" y="166" font-size="10" fill="#64748b">（地面的根本热源）</text>

  <!-- 大气削弱 -->
  <path d="M 140 145 L 80 180" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,3"/>
  <polygon points="80,180 88,172 92,182" fill="#94a3b8"/>
  <text x="35" y="195" font-size="11" fill="#64748b">反射/散射/吸收削弱</text>

  <!-- 2. 地面长波辐射箭头 -->
  <path d="M 280 238 L 320 120" fill="none" stroke="#b91c1c" stroke-width="4"/>
  <polygon points="320,120 312,132 326,128" fill="#b91c1c"/>
  <text x="300" y="175" font-size="12" fill="#b91c1c" font-weight="bold">② 地面长波辐射</text>
  <text x="300" y="191" font-size="10" fill="#b91c1c">（近地面大气的直接热源）</text>

  <!-- 3. 大气逆辐射箭头 -->
  <path d="M 440 135 L 410 232" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polygon points="410,232 406,218 419,222" fill="#2563eb"/>
  <text x="430" y="175" font-size="12" fill="#2563eb" font-weight="bold">③ 大气逆辐射</text>
  <text x="430" y="191" font-size="10" fill="#2563eb">（对地面起保温作用）</text>
</svg>