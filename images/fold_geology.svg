<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f8fafc" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">褶皱构造及“背斜成谷、向斜成山”地形倒置示意图</text>

  <!-- 地表地形线（左侧为谷地，右侧为山岭） -->
  <path d="M 20 180 Q 150 230 280 180 Q 420 80 580 180 L 580 310 L 20 310 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>

  <!-- 背斜岩层线 (向上拱起) -->
  <path d="M 30 290 Q 150 190 270 290" fill="none" stroke="#0284c7" stroke-width="3"/>
  <path d="M 30 250 Q 150 150 270 250" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="150" y="215" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">背斜 (岩层向上拱)</text>
  <text x="150" y="145" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">【背斜成谷】</text>
  <text x="150" y="163" font-size="10" fill="#64748b" text-anchor="middle">顶部受张力，裂隙发育易被侵蚀</text>

  <!-- 向斜岩层线 (向下弯曲) -->
  <path d="M 290 250 Q 420 350 560 250" fill="none" stroke="#15803d" stroke-width="3"/>
  <path d="M 290 210 Q 420 310 560 210" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="420" y="275" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">向斜 (岩层向下弯)</text>
  <text x="420" y="75" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">【向斜成山】</text>
  <text x="420" y="93" font-size="10" fill="#64748b" text-anchor="middle">槽部受挤压，岩性坚硬不易被侵蚀</text>

  <!-- 地质应用 -->
  <rect x="30" y="275" width="240" height="26" rx="4" fill="#bae6fd"/>
  <text x="150" y="293" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">⛽ 储油储气构造 / 采石场</text>

  <rect x="300" y="275" width="240" height="26" rx="4" fill="#bbf7d0"/>
  <text x="420" y="293" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">💧 良好储水构造 / 挖隧道</text>
</svg>