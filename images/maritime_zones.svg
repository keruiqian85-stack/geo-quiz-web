<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#f0f9ff" rx="12"/>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">《联合国海洋法公约》海洋权益空间范围划分示意图</text>

  <!-- 陆地 -->
  <rect x="20" y="180" width="100" height="100" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="235" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">沿海国陆地</text>

  <!-- 海水与海床 -->
  <polygon points="120,200 600,200 600,280 120,280" fill="#38bdf8" opacity="0.7"/>

  <!-- 领海基线 -->
  <line x1="120" y1="120" x2="120" y2="280" stroke="#dc2626" stroke-width="3"/>
  <text x="120" y="110" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">领海基线</text>

  <!-- 12海里 领海 -->
  <line x1="200" y1="140" x2="200" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="120" y1="160" x2="200" y2="160" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="155" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">12海里</text>
  <rect x="125" y="210" width="70" height="24" rx="4" fill="#dbeafe"/>
  <text x="160" y="227" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">领海(主权)</text>

  <!-- 24海里 毗连区 -->
  <line x1="260" y1="140" x2="260" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="230" y="155" font-size="11" fill="#64748b">毗连区</text>

  <!-- 200海里 专属经济区 -->
  <line x1="480" y1="140" x2="480" y2="280" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="120" y1="180" x2="480" y2="180" stroke="#059669" stroke-width="2.5"/>
  <text x="300" y="175" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">200 海里 专属经济区 (EEZ)</text>

  <!-- 公海 -->
  <text x="530" y="235" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">公 海</text>

  <rect x="30" y="285" width="540" height="26" rx="4" fill="#e2e8f0"/>
  <text x="300" y="303" font-size="12" fill="#334155" text-anchor="middle">沿海国在专属经济区内享有勘探开发自然资源的专有主权权利与管辖权</text>
</svg>